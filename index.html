<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상온 타이머 — 김치 · 밥 보관시간 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root[data-theme="light"]{
    --bg-deep:#f6f2ea;
    --panel:#ffffff;
    --panel-line:rgba(43,32,24,0.10);
    --ink:#2a2018;
    --ink-soft:#7a6b5c;
    --ink-dim:#b0a494;
    --kimchi-1:#c23b2e;
    --kimchi-2:#8f2a20;
    --rice-1:#c9973a;
    --rice-2:#9c7024;
    --overlay-1:rgba(43,32,24,0.035);
    --overlay-2:rgba(43,32,24,0.07);
    --overlay-input:rgba(43,32,24,0.03);
    --card-shadow:0 4px 16px -6px rgba(43,32,24,0.10);
    --danger:#c23f6f;
    --danger-hover:#9c2d56;
    --ok:#3f8f5c;
    --warn-bg:rgba(194,59,46,0.10);
    --warn-text:#a5301f;
  }
  :root[data-theme="dark"]{
    --bg-deep:#160f0a;
    --panel:rgba(255,255,255,0.05);
    --panel-line:rgba(255,255,255,0.14);
    --ink:#f3ece2;
    --ink-soft:#c2ac96;
    --ink-dim:#8a7660;
    --kimchi-1:#ff6a54;
    --kimchi-2:#ff6a54;
    --rice-1:#f0bd63;
    --rice-2:#f0bd63;
    --overlay-1:rgba(255,255,255,0.045);
    --overlay-2:rgba(255,255,255,0.09);
    --overlay-input:rgba(255,255,255,0.05);
    --card-shadow:0 4px 20px -6px rgba(0,0,0,0.45);
    --danger:#ff9bbd;
    --danger-hover:#ff5c92;
    --ok:#6fd39a;
    --warn-bg:rgba(255,106,84,0.16);
    --warn-text:#ff9683;
  }
  :root{ --radius-lg:20px; --radius-md:14px; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    display:flex; justify-content:center;
    padding:30px 16px 70px;
    font-family:'Pretendard Variable','Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;
    color:var(--ink);
    background:var(--bg-deep);
    transition:background .25s ease, color .25s ease;
  }
  .wrap{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px; }

  /* ---- 로그인 화면 ---- */
  .login-screen{
    display:none; position:fixed; inset:0; z-index:999; justify-content:center; align-items:center;
    flex-direction:column; overflow:hidden;
    background: radial-gradient(120% 55% at 50% -10%, rgba(194,59,46,0.14), transparent 62%), var(--bg-deep);
  }
  .login-screen.active{ display:flex; }
  .login-content{ max-width:440px; width:100%; padding:0 28px; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .login-emoji{ font-size:64px; margin-bottom:18px; filter:drop-shadow(0 10px 18px rgba(194,59,46,0.35)); }
  .login-content h1{ margin:0 0 14px; font-size:clamp(1.8rem,6.4vw,2.4rem); font-weight:900; line-height:1.28; letter-spacing:-0.02em; color:var(--ink); }
  .login-content p{ color:var(--ink-soft); margin:0 0 26px; font-size:1rem; font-weight:600; line-height:1.6; max-width:340px; }
  .feature-badges{ display:flex; gap:10px; justify-content:center; margin-bottom:32px; flex-wrap:wrap; }
  .feature-badge{ display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:10px 16px; font-size:0.8rem; font-weight:800; white-space:nowrap; }
  .feature-badge.fb-1{ background:rgba(194,59,46,0.14); color:var(--kimchi-2); }
  .feature-badge.fb-2{ background:rgba(201,151,58,0.16); color:var(--rice-2); }
  .feature-badge.fb-3{ background:rgba(63,143,92,0.14); color:var(--ok); }
  .google-btn{
    width:100%; max-width:340px; padding:17px 20px; background:#ffffff; border:1px solid rgba(43,32,24,0.14);
    border-radius:16px; cursor:pointer; font-weight:800; color:#3c4043; font-size:1.02rem;
    display:flex; align-items:center; justify-content:center; gap:12px;
    box-shadow:0 10px 24px -8px rgba(194,59,46,0.30), 0 2px 8px rgba(43,32,24,0.10);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .google-btn:hover{ transform:translateY(-3px); }
  .google-btn:active{ transform:translateY(0) scale(0.98); }

  .theme-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:-6px; gap:8px; }
  .theme-toggle{ display:flex; align-items:center; gap:6px; background:var(--overlay-1); border:1px solid var(--panel-line); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:0.72rem; font-weight:600; color:var(--ink-soft); flex-shrink:0; }

  .tab-group{ display:flex; gap:6px; background:var(--overlay-1); border:1px solid var(--panel-line); border-radius:999px; padding:4px; }
  .tab-btn{ border:none; background:none; cursor:pointer; font-weight:800; font-size:0.8rem; padding:7px 14px; border-radius:999px; color:var(--ink-dim); display:flex; align-items:center; gap:5px; transition:background .15s ease, color .15s ease; }
  .tab-btn.selected.kimchi{ background:linear-gradient(135deg, var(--kimchi-1), var(--kimchi-2)); color:#fff; }
  .tab-btn.selected.rice{ background:linear-gradient(135deg, var(--rice-1), var(--rice-2)); color:#fff; }

  .card{ background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius-lg); padding:22px 20px; box-shadow:var(--card-shadow); transition:background .25s ease; }

  .user-info{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; padding-bottom:12px; border-bottom:1px solid var(--panel-line); font-size:0.8rem; }
  .user-name{ font-weight:600; }
  .logout-btn{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.7rem; font-weight:600; padding:4px; }

  /* ---- 품목 카드 ---- */
  .item-card{ padding:20px; }
  .item-card.kimchi{ border-top:4px solid var(--kimchi-1); }
  .item-card.rice{ border-top:4px solid var(--rice-1); }
  .item-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .item-emoji{ font-size:1.5rem; }
  .item-title{ font-weight:800; font-size:1.15rem; letter-spacing:-0.01em; }
  .item-sub{ font-size:0.72rem; color:var(--ink-dim); margin-left:auto; cursor:pointer; border-bottom:1px dotted var(--ink-dim); padding-bottom:1px; }

  .status-box{ border-radius:16px; padding:18px; text-align:center; background:var(--overlay-1); }
  .status-label{ font-size:0.76rem; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .clock-big{ font-size:1.9rem; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .clock-sub{ font-size:0.74rem; color:var(--ink-dim); margin-top:6px; }
  .clock-sub.editable{ cursor:pointer; border-bottom:1px dotted var(--ink-dim); display:inline-block; padding-bottom:1px; font-weight:600; }
  .clock-sub.editable:hover{ color:var(--kimchi-1); border-color:var(--kimchi-1); }

  /* ---- 다중 진행중 세션 카드 ---- */
  .active-empty{ border-radius:16px; padding:18px; text-align:center; background:var(--overlay-1); }
  .active-list{ display:flex; flex-direction:column; gap:10px; }
  .active-card{ border-radius:16px; padding:16px; text-align:center; background:var(--overlay-1); position:relative; }
  .active-card.kimchi{ background:linear-gradient(160deg, rgba(194,59,46,0.10), rgba(194,59,46,0.03)); }
  .active-card.rice{ background:linear-gradient(160deg, rgba(201,151,58,0.12), rgba(201,151,58,0.03)); }
  .label-badge{ display:inline-block; font-size:1rem; font-weight:900; padding:6px 14px; border-radius:999px; margin-bottom:10px; background:var(--overlay-2); color:var(--ink); cursor:pointer; border:1px dashed var(--panel-line); }
  .label-badge:hover{ color:var(--kimchi-1); border-color:var(--kimchi-1); }
  .mini-insight-big{ font-size:1.65rem; font-weight:900; margin-top:10px; letter-spacing:-0.01em; }
  .active-card.kimchi .mini-insight-big{ color:var(--kimchi-1); }
  .active-card.rice .mini-insight-big{ color:var(--rice-2); }
  .mini-insight{ font-size:0.82rem; font-weight:600; color:var(--ink-soft); margin-top:4px; line-height:1.4; }
  .end-btn{ width:100%; margin-top:12px; border-radius:12px; padding:11px; font-weight:800; font-size:0.85rem; cursor:pointer; background:var(--overlay-2); color:var(--ink); border:1px solid var(--panel-line); }
  .hist-label{ font-size:0.66rem; font-weight:800; color:var(--ink-soft); margin-bottom:3px; cursor:pointer; display:inline-block; border-bottom:1px dashed var(--ink-dim); }
  .hist-label:hover{ color:var(--kimchi-1); border-color:var(--kimchi-1); }

  .insight-box{ margin-top:12px; border-radius:14px; padding:16px 16px; background:var(--overlay-1); border:1px solid var(--panel-line); display:none; text-align:center; }
  .insight-box.show{ display:block; }
  .insight-title{ font-size:0.76rem; font-weight:800; color:var(--ink-soft); margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:5px; }
  .insight-big{ font-size:1.65rem; font-weight:900; letter-spacing:-0.01em; margin-bottom:2px; }
  .insight-box.kimchi .insight-big{ color:var(--kimchi-1); }
  .insight-box.rice .insight-big{ color:var(--rice-2); }
  .insight-meta{ font-size:0.95rem; font-weight:800; color:var(--ink); margin-bottom:8px; }
  .insight-detail{ font-size:0.82rem; font-weight:600; color:var(--ink-soft); line-height:1.5; margin-bottom:10px; }
  .insight-disclaimer{ font-size:0.62rem; color:var(--ink-dim); line-height:1.4; border-top:1px solid var(--panel-line); padding-top:8px; }

  .item-btn{ width:100%; margin-top:14px; border:none; border-radius:14px; padding:14px; font-weight:800; font-size:0.95rem; cursor:pointer; color:#fff; transition:transform .08s ease; }
  .item-btn:active{ transform:scale(0.98); }
  .item-btn.start.kimchi{ background:linear-gradient(135deg, var(--kimchi-1), var(--kimchi-2)); }
  .item-btn.start.rice{ background:linear-gradient(135deg, var(--rice-1), var(--rice-2)); }
  .item-btn.stop{ background:var(--overlay-2); color:var(--ink); border:1px solid var(--panel-line); }

  .history-toggle{ text-align:center; margin-top:10px; font-size:0.74rem; color:var(--ink-dim); cursor:pointer; font-weight:600; }
  .history-list{ display:none; flex-direction:column; gap:6px; margin-top:10px; max-height:220px; overflow-y:auto; }
  .history-list.open{ display:flex; }
  .history-empty{ text-align:center; font-size:0.75rem; color:var(--ink-dim); padding:10px 0; }
  .hist-row{ display:flex; align-items:center; justify-content:space-between; background:var(--overlay-1); border-radius:10px; padding:8px 10px; font-size:0.74rem; gap:6px; cursor:pointer; }
  .hist-times{ display:flex; flex-direction:column; gap:2px; color:var(--ink); }
  .hist-times .t-line{ display:flex; gap:6px; align-items:center; }
  .hist-times .t-tag{ font-size:0.62rem; font-weight:800; color:var(--ink-dim); width:28px; }
  .hist-times .t-val{ font-variant-numeric:tabular-nums; cursor:pointer; border-bottom:1px dotted var(--ink-dim); }
  .hist-times .t-val:hover{ color:var(--kimchi-1); }
  .hist-dur{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hist-dur.over{ color:var(--warn-text); }
  .hist-del{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.85rem; padding:2px 4px; }
  .time-edit-input{ font-size:0.72rem; font-family:inherit; color:var(--ink); background:var(--overlay-input); border:1px solid var(--kimchi-1); border-radius:6px; padding:1px 4px; width:112px; }
  .hist-row{ border:1.5px solid transparent; transition:background .15s ease, border-color .15s ease; }
  .hist-row.kimchi.selected{ background:rgba(194,59,46,0.14); border-color:var(--kimchi-1); }
  .hist-row.rice.selected{ background:rgba(201,151,58,0.18); border-color:var(--rice-2); }

  .footer-actions{ display:flex; justify-content:center; margin-top:4px; }
  .link-btn{ background:none; border:none; cursor:pointer; font-size:0.72rem; color:var(--ink-dim); font-weight:600; padding:6px; }
  .link-btn.danger{ color:var(--danger); }

  /* ---- 임계시간 설정 모달 ---- */
  .modal-overlay{
    display:flex; position:fixed; inset:0; background:rgba(20,14,9,0.55);
    z-index:1000; align-items:center; justify-content:center; padding:20px;
    visibility:hidden; opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  .modal-overlay.active{ visibility:visible; opacity:1; pointer-events:auto; }
  .modal-card{ background:var(--panel); border-radius:22px; padding:22px 20px; max-width:320px; width:100%; box-shadow:var(--card-shadow); border:1px solid var(--panel-line); }
  .modal-title{ font-weight:800; font-size:1.05rem; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .modal-row{ display:flex; gap:10px; align-items:flex-end; margin-bottom:10px; }
  .modal-field{ flex:1; }
  .modal-field label{ display:block; font-size:0.72rem; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
  .modal-field input{ width:100%; border:1px solid var(--panel-line); border-radius:12px; padding:11px 12px; font-size:1rem; background:var(--overlay-input); color:var(--ink); text-align:center; font-variant-numeric:tabular-nums; }
  .modal-preset-row{ display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 16px; }
  .modal-preset{ border:1px solid var(--panel-line); background:var(--overlay-1); color:var(--ink-soft); border-radius:999px; padding:9px 16px; font-size:0.92rem; font-weight:800; cursor:pointer; }
  .modal-preset.selected{ background:var(--kimchi-1); border-color:var(--kimchi-1); color:#fff; }
  .modal-btns{ display:flex; gap:8px; }
  .modal-btns button{ flex:1; border:none; border-radius:12px; padding:12px; font-weight:800; font-size:0.85rem; cursor:pointer; }
  .modal-save{ background:var(--kimchi-1); color:#fff; }
  .modal-cancel{ background:var(--overlay-2); color:var(--ink-soft); }

  /* ---- 달력 ---- */
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .nav-btn{ width:34px; height:34px; border-radius:12px; border:1px solid var(--panel-line); background:var(--overlay-1); color:var(--kimchi-1); font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cal-title{ font-weight:800; font-size:1.05rem; letter-spacing:-0.01em; }
  .grid7{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .dow{ font-size:0.62rem; color:var(--ink-dim); font-weight:700; text-align:center; padding-bottom:4px; }
  .day-cell{ aspect-ratio:1/1; border-radius:12px; background:var(--overlay-1); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:0.76rem; font-weight:700; color:var(--ink-soft); cursor:pointer; position:relative; border:1.5px solid transparent; }
  .day-cell.empty{ visibility:hidden; cursor:default; }
  .day-cell.is-today{ border-color:var(--rice-1); }
  .day-cell.is-filtered{ border-color:var(--ink); background:var(--overlay-2); }
  .day-cell.has-record.kimchi{ background:rgba(194,59,46,0.14); color:var(--kimchi-2); }
  .day-cell.has-record.rice{ background:rgba(201,151,58,0.18); color:var(--rice-2); }
  .day-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .day-dot.kimchi{ background:var(--kimchi-1); }
  .day-dot.rice{ background:var(--rice-1); }
  .cal-legend{ display:flex; justify-content:center; gap:16px; font-size:0.68rem; color:var(--ink-dim); margin-top:14px; padding-top:12px; border-top:1px solid var(--panel-line); }
  .cal-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .filter-banner{ display:flex; align-items:center; justify-content:space-between; background:var(--overlay-1); border:1px solid var(--panel-line); border-radius:12px; padding:9px 12px; margin-bottom:12px; font-size:0.76rem; font-weight:700; }
  .filter-banner button{ background:none; border:none; color:var(--kimchi-1); font-weight:800; cursor:pointer; font-size:0.72rem; }
</style>
</head>
<body>

<div class="login-screen active" id="loginScreen">
  <div class="login-content">
    <div class="login-emoji">🥬⏱️🍚</div>
    <h1>상온 보관 타이머</h1>
    <p>김치를 실온에 꺼낸 시간, 밥을 냉장고에서 꺼낸 시간을 기록하고 실시간으로 경과시간을 확인하세요. 오래 두면 자동으로 알림도 드려요.</p>
    <div class="feature-badges">
      <div class="feature-badge fb-1">🥬 김치 실온 타이머</div>
      <div class="feature-badge fb-2">🍚 밥 상온 타이머</div>
      <div class="feature-badge fb-3">🔔 임계시간 알림</div>
    </div>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg width="22" height="22" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12
          c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24
          c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039
          l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36
          c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571
          c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24
          C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      Google 계정으로 시작하기
    </button>
  </div>
</div>

<div class="wrap" id="appScreen" style="display:none;">
  <div class="theme-row">
    <div class="tab-group" id="tabGroup">
      <button class="tab-btn" id="tabBtn-kimchi" onclick="switchTab('kimchi')">🥬 김치</button>
      <button class="tab-btn" id="tabBtn-rice" onclick="switchTab('rice')">🍚 밥</button>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><span id="themeIcon">🌙</span> <span id="themeLabel">다크</span></button>
  </div>

  <div class="card">
    <div class="user-info">
      <span class="user-name" id="userName">사용자</span>
      <button class="logout-btn" onclick="signOut()">로그아웃</button>
    </div>
  </div>

  <div id="itemCardsRoot"></div>

  <div class="card" id="filterBannerWrap" style="display:none;">
    <div class="filter-banner">
      <span id="filterBannerText"></span>
      <button onclick="clearDateFilter()">전체보기</button>
    </div>
  </div>

  <div class="card">
    <div class="cal-header">
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="cal-title" id="calTitle">달력 로딩중</div>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="grid7" id="dowRow"></div>
    <div class="grid7" id="calGrid"></div>
    <div class="cal-legend">
      <span><span class="day-dot" id="calLegendDot"></span><span id="calLegendText">기록 있음</span></span>
    </div>
  </div>

  <div class="footer-actions">
    <button class="link-btn danger" onclick="clearAllData()">전체 기록 삭제</button>
  </div>
</div>

<div class="modal-overlay" id="timeEditModalOverlay" onclick="if(event.target===this) closeTimeEditModal()">
  <div class="modal-card">
    <div class="modal-title" id="timeEditModalTitle">✏️ 시각 수정</div>
    <div class="modal-field" style="margin-bottom:16px;">
      <label>날짜 &amp; 시각</label>
      <input type="datetime-local" id="timeEditInput">
    </div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeTimeEditModal()">취소</button>
      <button class="modal-save" onclick="saveTimeEditModal()">저장</button>
    </div>
  </div>
</div>

/* ---- Firestore storage wrapper ---- */
const storage = {
  async get(key){
    try{ const doc = await db.collection(COLLECTION).doc(key).get(); if(!doc.exists) return null; return { key, value: doc.data().value }; }
    catch(e){ return null; }
  },
  async set(key, value){
    try{ await db.collection(COLLECTION).doc(key).set({ value, updatedAt: Date.now() }); return { key, value }; }
    catch(e){ return null; }
  },
  async delete(key){
    try{ await db.collection(COLLECTION).doc(key).delete(); return { key, deleted:true }; }
    catch(e){ return null; }
  },
  async list(prefix){
    try{ const snap = await db.collection(COLLECTION).get(); const keys = snap.docs.map(d=>d.id).filter(id=>id.startsWith(prefix)); return { keys }; }
    catch(e){ return null; }
  }
};

let HISTORY = {};  // { kimchi: [ {id,start,end} ], rice: [...] }

{ const t = new Date(); todayY = t.getFullYear(); todayM = t.getMonth(); todayD = t.getDate(); }

let opChain = Promise.resolve();
function serialize(fn){ const r = opChain.then(fn, fn); opChain = r.catch(()=>{}); return r; }

/* ---- 테마 ---- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeLabel').innerText = theme === 'dark' ? '라이트 모드' : '다크 모드';

function toggleTheme(){

  storage.set('theme', next).catch(()=>{});
}

async function loadActiveTab(){

/* ---- 기록(히스토리) ---- */
function histKey(key){ return `sessions:${key}`; }
async function loadHistory(key){
  try{
    const r = await storage.get(histKey(key));
    HISTORY[key] = (r && r.value) ? JSON.parse(r.value) : [];
  }catch(e){ HISTORY[key] = []; }
}
async function saveHistory(key){
  const arr = HISTORY[key];
  if(arr.length === 0) await storage.delete(histKey(key));
  else await storage.set(histKey(key), JSON.stringify(arr));
}
function activeEntries(key){ return HISTORY[key].filter(e => !e.end).sort((a,b)=> new Date(a.start)-new Date(b.start)); }
function escapeHtml(s){

}

/* ---- 카드 빌드 & 렌더 (한 번에 활성 탭 하나만 표시) ---- */

function switchTab(key){

  activeTab = key;
  filterDate = null;
  document.getElementById('filterBannerWrap').style.display = 'none';

function dayKeyStr(y,m,d){ return `${y}-${m}-${d}`; }
// 기록이 "속한" 날짜: 끝난 기록은 끝난 날(=꺼낸/먹은 날) 기준.
// 아직 진행 중이면 "오늘 넣은 건 내일 먹는다"는 원칙에 따라 무조건 시작일+1일(다음날) 기준.
function entryDate(entry){
  if(entry.end) return new Date(entry.end);
  const d = new Date(entry.start);
  d.setDate(d.getDate() + 1);
  return d;
}

function renderCalendar(){
  const it = ITEMS.find(i=>i.key===activeTab);
  document.getElementById('calTitle').innerText = `${calY}.${pad2(calM+1)}`;
  document.getElementById('calLegendDot').className = 'day-dot ' + it.key;
  document.getElementById('calLegendText').textContent = `${it.label} 기록 있음`;
  const dowRow = document.getElementById('dowRow');
  if(!dowRow.dataset.done){
    ['일','월','화','수','목','금','토'].forEach(d=>{
      const el = document.createElement('div'); el.className='dow'; el.innerText=d; dowRow.appendChild(el);
    });
    dowRow.dataset.done = '1';
  }

  // 이 달에 현재 탭 품목의 기록이 있는 날짜 집계 (끝난 날짜 기준, 진행 중이면 시작일 기준)
  const dayHas = {}; // 'y-m-d' -> true
  HISTORY[activeTab].forEach(entry=>{
    const d = entryDate(entry);
    if(d.getFullYear()===calY && d.getMonth()===calM){
      dayHas[dayKeyStr(d.getFullYear(), d.getMonth(), d.getDate())] = true;
    }
  });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const firstDow = new Date(calY, calM, 1).getDay();
  const lastDate = new Date(calY, calM+1, 0).getDate();
  for(let i=0;i<firstDow;i++){ const e = document.createElement('div'); e.className='day-cell empty'; grid.appendChild(e); }
  for(let d=1; d<=lastDate; d++){
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const k = dayKeyStr(calY, calM, d);
    if(dayHas[k]) cell.classList.add('has-record', activeTab);
    cell.innerText = d;
    if(calY===todayY && calM===todayM && d===todayD) cell.classList.add('is-today');
    if(filterDate && filterDate.y===calY && filterDate.m===calM && filterDate.d===d) cell.classList.add('is-filtered');
    cell.onclick = ()=> onDayClick(calY, calM, d);
    grid.appendChild(cell);
  }
}

function changeMonth(dir){
  calM += dir;
  if(calM<0){ calM=11; calY--; } else if(calM>11){ calM=0; calY++; }
  renderCalendar();
}

function onDayClick(y,m,d){
  if(filterDate && filterDate.y===y && filterDate.m===m && filterDate.d===d){
    clearDateFilter();
    return;
  }
  filterDate = { y, m, d };
  historyOpen[activeTab] = true;
  selectedHist[activeTab] = null;
  document.getElementById('filterBannerWrap').style.display = 'block';
  document.getElementById('filterBannerText').textContent = `📅 ${y}.${pad2(m+1)}.${pad2(d)} 기록만 보는 중`;
  renderItem(activeTab);
  renderCalendar();
}

function clearDateFilter(){
  filterDate = null;
  selectedHist[activeTab] = null;
  document.getElementById('filterBannerWrap').style.display = 'none';
  renderItem(activeTab);
  renderCalendar();
}

function pad2(n){ return String(n).padStart(2,'0'); }
function fmtClock(totalSec){
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return `${h}:${pad2(m)}:${pad2(s)}`;
}
function fmtDate(d){
  return `${d.getMonth()+1}/${d.getDate()} ${formatTime12(d)}`;
}
function formatTime12(t){
  let h = t.getHours();
  const m = t.getMinutes();
  const ampm = h < 12 ? '오전' : '오후';
  let h12 = h % 12; if(h12===0) h12 = 12;
  return `${ampm} ${h12}:${pad2(m)}`;
}
function fmtDurationShort(ms){
  const totalMin = Math.floor(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  return h>0 ? `${h}시간 ${m}분` : `${m}분`;
}

function renderItem(key){
  const listEl = document.getElementById('activelist-'+key);
  if(!listEl) return; // 현재 활성 탭이 아니면 DOM이 없음
  const it = ITEMS.find(i=>i.key===key);
  const addBtn = document.getElementById('addbtn-'+key);

  listEl.innerHTML = '';

  if(filterDate){
    // 과거(혹은 다른) 날짜를 조회 중일 땐 "지금 진행 중"인 정보 대신, 그 날짜에 기록을 추가/수정할 수 있게 함
    addBtn.style.display = 'none';
    const notice = document.createElement('div');
    notice.className = 'active-empty';
    const dateLabel = `${filterDate.y}.${pad2(filterDate.m+1)}.${pad2(filterDate.d)}`;
    notice.innerHTML = `
      <div class="status-label">📅 ${dateLabel}</div>
      <button class="item-btn start ${key}" id="manualaddbtn-${key}" style="margin-top:10px;">+ 이 날짜에 기록 추가</button>
    `;
    listEl.appendChild(notice);
    document.getElementById('manualaddbtn-'+key).addEventListener('click', ()=> openManualAddModal(key));
  } else {
    addBtn.style.display = '';
    const actives = activeEntries(key);
    if(actives.length === 0){
      const empty = document.createElement('div');
      empty.className = 'active-empty';
      empty.innerHTML = `
        <div class="status-label">${it.idleLabel}</div>
        <div class="clock-big">--:--:--</div>
        <div class="clock-sub">${it.idleSub}</div>
      `;
      listEl.appendChild(empty);
    } else {
      actives.forEach(entry=>{
        const card = document.createElement('div');
        card.className = 'active-card ' + key;
        const elapsedMs = Date.now() - new Date(entry.start).getTime();
        const totalSec = Math.max(Math.floor(elapsedMs/1000),0);
        const elapsedMin = elapsedMs/60000;
        const stage = it.insightStages.find(s => elapsedMin < s.maxMin) || it.insightStages[it.insightStages.length-1];
        const labelHtml = entry.label
          ? `🏷️ ${escapeHtml(entry.label)} · 수정`
          : `+ 라벨 추가`;
        card.innerHTML = `
          <div class="label-badge" data-id="${entry.id}">${labelHtml}</div>
          <div class="status-label">${it.activeLabel}</div>
          <div class="clock-big">${fmtClock(totalSec)}</div>
          <div class="clock-sub editable" data-id="${entry.id}">✏️ ${fmtDate(new Date(entry.start))}에 ${it.startedSuffix} · 시간 수정</div>
          <div class="mini-insight-big">${it.insightIcon} ${stage.big}</div>
          <div class="mini-insight">${stage.detail}</div>
          <button class="end-btn" data-id="${entry.id}">${it.verbEnd}</button>
        `;
        card.querySelector('.clock-sub').addEventListener('click', ()=> openTimeEditModal(key, entry.id, 'start'));
        card.querySelector('.label-badge').addEventListener('click', ()=> openLabelEditModal(key, entry.id));
        card.querySelector('.end-btn').addEventListener('click', ()=> endEntry(key, entry.id));
        listEl.appendChild(card);
      });
    }
  }

  // 상단 큰 인사이트 박스: 기록을 클릭하기 전엔 비어있고, 클릭한 기록의 정보로 채워짐
  updateInsightBox(key);

  renderHistory(key);
}

function updateInsightBox(key){
  const it = ITEMS.find(i=>i.key===key);
  const insightBox = document.getElementById('insight-'+key);
  const insightBig = document.getElementById('insightbig-'+key);
  const insightDetail = document.getElementById('insightdetail-'+key);
  const insightMeta = document.getElementById('insightmeta-'+key);
  const selId = selectedHist[key];
  const entry = selId ? HISTORY[key].find(e=>e.id===selId) : null;
  if(!entry){
    insightBox.classList.remove('show');
    return;
  }
  const startD = new Date(entry.start);
  const endD = entry.end ? new Date(entry.end) : new Date();
  const durMin = (endD - startD) / 60000;
  const stage = it.insightStages.find(s => durMin < s.maxMin) || it.insightStages[it.insightStages.length-1];
  insightBig.textContent = stage.big;
  insightMeta.textContent = `${entry.label ? escapeHtml(entry.label)+' · ' : ''}${fmtDate(startD)} ~ ${entry.end ? fmtDate(endD) : '진행 중'} (${fmtDurationShort(durMin*60000)})`;
  insightDetail.textContent = stage.detail;
  insightBox.classList.add('show');
}

function renderHistory(key){
  const toggle = document.getElementById('histtoggle-'+key);
  const list = document.getElementById('histlist-'+key);

  if(!filterDate){
    // 날짜를 고르기 전엔 지난 기록 자체를 보여주지 않음
    toggle.style.display = 'none';
    list.classList.remove('open');
    list.innerHTML = '';
    return;
  }

  toggle.style.display = 'none';
  list.classList.add('open');

  list.innerHTML = '';
  let entries = [...HISTORY[key]];
  entries = entries.filter(e=>{
    const d = entryDate(e);
    return d.getFullYear()===filterDate.y && d.getMonth()===filterDate.m && d.getDate()===filterDate.d;
  });
  entries.sort((a,b)=> new Date(b.start) - new Date(a.start));
  if(entries.length === 0){
    const e = document.createElement('div');
    e.className = 'history-empty';
    e.textContent = '이 날은 기록이 없어요';
    list.appendChild(e);
    return;
  }
  const it = ITEMS.find(i=>i.key===key);
  entries.forEach(entry=>{
    const row = document.createElement('div');
    row.className = 'hist-row ' + key + (selectedHist[key] === entry.id ? ' selected' : '');
    const startD = new Date(entry.start);
    const endD = entry.end ? new Date(entry.end) : null;
    const durMs = endD ? (endD - startD) : (Date.now() - startD);

    const startHtml = `<span class="t-val" data-id="${entry.id}" data-field="start">✏️ ${fmtDate(startD)}</span>`;
    const endHtml = entry.end
      ? `<span class="t-val" data-id="${entry.id}" data-field="end">✏️ ${fmtDate(endD)}</span>`
      : `<span style="color:var(--ink-dim);">진행 중</span>`;

    row.innerHTML = `
      <div class="hist-times">
        <div class="hist-label" data-id="${entry.id}">${entry.label ? `🏷️ ${escapeHtml(entry.label)}` : '+ 라벨 추가'}</div>
        <div class="t-line"><span class="t-tag">${it.histStartTag}</span>${startHtml}</div>
        <div class="t-line"><span class="t-tag">${entry.end ? it.histEndTag : ''}</span>${endHtml}</div>
      </div>
      <div class="hist-dur">${fmtDurationShort(durMs)}</div>
      <button class="hist-del" data-id="${entry.id}">✕</button>
    `;

    row.querySelectorAll('.t-val').forEach(el=>{
      el.addEventListener('click', (ev)=>{ ev.stopPropagation(); openTimeEditModal(key, el.dataset.id, el.dataset.field); });
    });
    row.querySelector('.hist-label').addEventListener('click', (ev)=>{ ev.stopPropagation(); openLabelEditModal(key, entry.id); });
    row.querySelector('.hist-del').addEventListener('click', (ev)=>{ ev.stopPropagation(); deleteEntry(key, entry.id); });
    row.addEventListener('click', ()=>{
      selectedHist[key] = (selectedHist[key] === entry.id) ? null : entry.id;
      renderHistory(key);
      updateInsightBox(key);
    });

    list.appendChild(row);
  });
}

/* ---- 시각(꺼낸/넣은 시간) 직접 수정 모달 ---- */
let timeEditCtx = null; // { key, id, field }
function toDatetimeLocalValue(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/* ---- 새 기록 시작 / 라벨 수정 모달 ---- */
let startModalCtx = null; // { mode:'new'|'editLabel', key, id? }
function buildPresetRow(key){
  const row = document.getElementById('startPresetRow');
  row.innerHTML = '';
  const presets = key==='rice' ? ['아침','점심','저녁','야식'] : ['배추김치','열무김치','갓김치','깍두기'];
  presets.forEach(p=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'modal-preset';
    chip.textContent = p;
    chip.onclick = ()=>{ document.getElementById('startLabelInput').value = p; };
    row.appendChild(chip);
  });
}
function openStartModal(key){
  const it = ITEMS.find(i=>i.key===key);
  startModalCtx = { mode:'new', key };
  document.getElementById('startModalTitle').textContent = `${it.emoji} ${it.verbStart}`;
  document.getElementById('startLabelInput').value = '';
  buildPresetRow(key);
  document.getElementById('startModalOverlay').classList.add('active');
}
function openLabelEditModal(key, id){
  const entry = HISTORY[key].find(e=>e.id===id);
  if(!entry) return;
  startModalCtx = { mode:'editLabel', key, id };
  document.getElementById('startModalTitle').textContent = '🏷️ 라벨 수정';
  document.getElementById('startLabelInput').value = entry.label || '';
  buildPresetRow(key);
  document.getElementById('startModalOverlay').classList.add('active');
}
function closeStartModal(){
  document.getElementById('startModalOverlay').classList.remove('active');
  startModalCtx = null;
}
function confirmStartModal(){
  if(!startModalCtx) return;
  const label = document.getElementById('startLabelInput').value.trim();
  const { mode, key, id } = startModalCtx;
  return serialize(async ()=>{
    if(mode === 'new'){
      HISTORY[key].push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), start: new Date().toISOString(), end: null, label });
    } else {
      const entry = HISTORY[key].find(e=>e.id===id);
      if(entry) entry.label = label;
    }
    await saveHistory(key);
    closeStartModal();
    renderItem(key);
    renderCalendar();
  });
}
function endEntry(key, id){
  return serialize(async ()=>{
    const entry = HISTORY[key].find(e=>e.id===id);
    if(!entry) return;
    entry.end = new Date().toISOString();
    await saveHistory(key);
    renderItem(key);
    renderCalendar();
  });
}

/* ---- 지난 날짜에 기록 직접 추가 ---- */
function openManualAddModal(key){
  if(!filterDate) return;
  const it = ITEMS.find(i=>i.key===key);
  document.getElementById('manualAddModalTitle').textContent = `${it.emoji} ${filterDate.y}.${pad2(filterDate.m+1)}.${pad2(filterDate.d)}에 기록 추가`;
  document.getElementById('manualStartLabel').textContent = `${it.histStartTag} 시각`;
  document.getElementById('manualEndLabel').textContent = `${it.histEndTag} 시각 (비워두면 진행 중으로 저장)`;
  document.getElementById('manualLabelInput').value = '';
  const pad = n => String(n).padStart(2,'0');
  const dateStr = `${filterDate.y}-${pad(filterDate.m+1)}-${pad(filterDate.d)}`;
  document.getElementById('manualStartInput').value = `${dateStr}T09:00`;
  document.getElementById('manualEndInput').value = `${dateStr}T18:00`;

  const row = document.getElementById('manualPresetRow');
  row.innerHTML = '';
  const presets = key==='rice' ? ['아침','점심','저녁','야식'] : ['배추김치','열무김치','갓김치','깍두기'];
  presets.forEach(p=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'modal-preset';
    chip.textContent = p;
    chip.onclick = ()=>{ document.getElementById('manualLabelInput').value = p; };
    row.appendChild(chip);
  });

  manualAddKey = key;
  document.getElementById('manualAddModalOverlay').classList.add('active');
}
let manualAddKey = null;
function closeManualAddModal(){
  document.getElementById('manualAddModalOverlay').classList.remove('active');
  manualAddKey = null;
}
function confirmManualAddModal(){
  if(!manualAddKey) return;
  const key = manualAddKey;
  const label = document.getElementById('manualLabelInput').value.trim();
  const startVal = document.getElementById('manualStartInput').value;
  const endVal = document.getElementById('manualEndInput').value;
  if(!startVal){ alert('시작 시각을 입력해 주세요.'); return; }
  const startD = new Date(startVal);
  if(isNaN(startD.getTime())){ alert('올바른 시작 시각이 아니에요.'); return; }
  let endD = null;
  if(endVal){
    endD = new Date(endVal);
    if(isNaN(endD.getTime())){ alert('올바른 종료 시각이 아니에요.'); return; }
    if(endD <= startD){ alert('종료 시각이 시작 시각보다 빠를 수 없어요.'); return; }
  }
  return serialize(async ()=>{
    HISTORY[key].push({
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      start: startD.toISOString(),
      end: endD ? endD.toISOString() : null,
      label
    });
    await saveHistory(key);
    closeManualAddModal();
    renderItem(key);
    renderCalendar();
  });
}

function openTimeEditModal(key, id, field){
  const entry = HISTORY[key].find(e=>e.id===id);
  if(!entry) return;
  timeEditCtx = { key, id, field };
  const it = ITEMS.find(i=>i.key===key);
  const d = new Date(field==='start' ? entry.start : entry.end);
  const fieldLabel = field==='start' ? it.histStartTag : it.histEndTag;
  document.getElementById('timeEditModalTitle').textContent = `✏️ ${it.emoji} ${it.label} · ${fieldLabel} 시각 수정`;
  document.getElementById('timeEditInput').value = toDatetimeLocalValue(d);
  document.getElementById('timeEditModalOverlay').classList.add('active');
}
function closeTimeEditModal(){
  document.getElementById('timeEditModalOverlay').classList.remove('active');
  timeEditCtx = null;
}
function saveTimeEditModal(){
  if(!timeEditCtx) return;
  const val = document.getElementById('timeEditInput').value;
  if(!val){ alert('시각을 입력해 주세요.'); return; }
  const newDate = new Date(val);
  if(isNaN(newDate.getTime())){ alert('올바른 날짜/시각이 아니에요.'); return; }
  return serialize(async ()=>{
    const { key, id, field } = timeEditCtx;
    const entry = HISTORY[key].find(e=>e.id===id);
    if(!entry){ closeTimeEditModal(); return; }
    const it = ITEMS.find(i=>i.key===key);
    if(field==='start' && entry.end && newDate >= new Date(entry.end)){
      alert(`${it.histStartTag} 시각이 ${it.histEndTag} 시각보다 늦을 수 없어요.`); return;
    }
    if(field==='end' && newDate <= new Date(entry.start)){
      alert(`${it.histEndTag} 시각이 ${it.histStartTag} 시각보다 빠를 수 없어요.`); return;
    }
    if(field==='start') entry.start = newDate.toISOString();
    else entry.end = newDate.toISOString();
    await saveHistory(key);
    closeTimeEditModal();
    renderItem(key);
    renderCalendar();
  });
}

function deleteEntry(key, id){
  return serialize(async ()=>{
    HISTORY[key] = HISTORY[key].filter(e=> e.id !== id);
    if(selectedHist[key] === id) selectedHist[key] = null;
    await saveHistory(key);
    renderItem(key);
    renderCalendar();
  });
}

function tick(){
  if(activeEntries(activeTab).length > 0) renderItem(activeTab);
}

async function clearAllData(){
  if(!confirm('⚠️ 저장된 모든 기록이 영구 삭제됩니다. 계속할까요?')) return;
  try{
    for(const it of ITEMS){
      const list = await storage.list(histKey(it.key));
      await storage.delete(histKey(it.key));
      HISTORY[it.key] = [];
    }
  }catch(e){}
  filterDate = null;
  document.getElementById('filterBannerWrap').style.display = 'none';
  renderItem(activeTab);
  renderCalendar();
}
</script>
